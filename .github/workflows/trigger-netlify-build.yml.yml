name: Rebuild site daily

on:
  schedule:
    - cron: '0 7 */2 * *'   # every other day at 07:00 UTC (odd dates of the month)
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build hook
        run: curl -fsS -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK }}"